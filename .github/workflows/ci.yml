name: CI

on:
  push:
    branches: [feature]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          FMT=$(gofmt -l .)
          if [ -n "$FMT" ]; then echo "Нужен gofmt:"; echo "$FMT"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o /tmp/traffic-bot .