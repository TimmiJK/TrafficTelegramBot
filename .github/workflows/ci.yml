name: CI

on:
  push:
    branches: [feature]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: traffic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/traffic_test?sslmode=disable
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          FMT=$(gofmt -l .)
          if [ -n "$FMT" ]; then echo "Нужен gofmt:"; echo "$FMT"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Build
        run: go build -trimpath -o /tmp/traffic-bot .