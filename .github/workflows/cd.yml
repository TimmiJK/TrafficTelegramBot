name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ~/TrafficTelegramBot

            git pull origin main

            set -a; . ./.env; set +a

            docker compose up -d postgres
            for i in $(seq 1 30); do
              docker exec traffic_bot-postgres pg_isready -U "$DB_USER" -d "$DB_NAME" && break
              sleep 2
            done

            docker run --rm --network host \
              -v "$PWD/migrations:/migrations:ro" \
              migrate/migrate:latest \
              -path=/migrations \
              -database "postgres://${DB_USER}:${DB_PASSWORD}@127.0.0.1:${DB_PORT}/${DB_NAME}?sslmode=disable" \
              up

            docker compose up -d --build
            docker compose ps
            docker image prune -f
      - name: Telegram notify
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="${ICON} Deploy ${STATUS}"
          TEXT="${TEXT}"$'\n'"Commit: ${SHORT_SHA} by ${{ github.actor }}"
          TEXT="${TEXT}"$'\n'"Run: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}"